name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan and invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Invariants I1 and I2
        run: bash scripts/check-invariants.sh
      - name: Scan history for secrets
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.21.2
          git --no-banner --redact --verbose /repo

  gate:
    name: Standard gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The database tests and the end-to-end tests run against local Supabase. Its
      # address and keys are the CLI's public defaults, written to apps/web/.env.local.
      - name: Start local Supabase
        run: |
          cp supabase/.env.example supabase/.env
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,realtime,edge-runtime,supavisor
          node scripts/write-local-env.mjs

      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test:cov
      - run: pnpm --filter web build
      - name: Install the browser for end-to-end tests
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - name: Keep the end-to-end report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
