name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the browser tests can be started on a branch before merging, without a label.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions and images are pinned to an exact commit or digest, so a tag that is moved
# later cannot change what runs here. Dependabot proposes the updates.

jobs:
  secrets:
    name: Secret scan and invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Invariants I1 and I2
        run: bash scripts/check-invariants.sh
      - name: Scan history for secrets
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          git --no-banner --redact --verbose /repo

  # The checks and the end-to-end tests run side by side; together they took about
  # 25 minutes in one job, which slow runners pushed past its limit.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in what ships
        run: pnpm audit --prod --audit-level high

      # The database tests and the end-to-end tests run against local Supabase. Its
      # address and keys are the CLI's public defaults, written to apps/web/.env.local.
      # The ports supabase/config.toml pins (54320 to 54324) all sit inside the kernel's
      # ephemeral range, 32768 to 60999, so any outbound connection can be given one as its
      # source port. `pnpm install` above makes hundreds, and when one still holds 54322 or
      # 54324 the container cannot bind it and this step fails with "address already in use".
      # It looked like a one-off on a shared runner; it is not. Reserving the range tells the
      # kernel never to hand those ports out, which is the whole fix. Seen three times on
      # 2026-11-02 (#101 Checks, #120 end-to-end, one more), each costing a full re-run.
      - name: Keep the kernel from handing out Supabase's ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54324
      - name: Start local Supabase
        run: |
          cp supabase/.env.example supabase/.env
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,realtime,edge-runtime,supavisor
          node scripts/write-local-env.mjs
      - name: Check the sign-in settings the app relies on
        run: |
          set -a && . apps/web/.env.local && set +a
          node scripts/check-auth-settings.mjs "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test:cov
      - run: pnpm --filter web build

  # The browser tests run on `main` after a merge, and on a pull request only when it carries the
  # `e2e` label or someone asks for the workflow by hand. They are the slowest job (about 13
  # minutes) and the whole account shares a pool of runners: with half a dozen branches in flight
  # they queued for an hour without starting, so a finished branch could not be confirmed green.
  # They are not skipped, only moved off the per-pull-request gate: a failure on `main` is a
  # failure that blocks the next merge, and it names the one merge that caused it.
  e2e:
    name: End-to-end tests
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The database tests and the end-to-end tests run against local Supabase. Its
      # address and keys are the CLI's public defaults, written to apps/web/.env.local.
      # The ports supabase/config.toml pins (54320 to 54324) all sit inside the kernel's
      # ephemeral range, 32768 to 60999, so any outbound connection can be given one as its
      # source port. `pnpm install` above makes hundreds, and when one still holds 54322 or
      # 54324 the container cannot bind it and this step fails with "address already in use".
      # It looked like a one-off on a shared runner; it is not. Reserving the range tells the
      # kernel never to hand those ports out, which is the whole fix. Seen three times on
      # 2026-11-02 (#101 Checks, #120 end-to-end, one more), each costing a full re-run.
      - name: Keep the kernel from handing out Supabase's ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54324
      - name: Start local Supabase
        run: |
          cp supabase/.env.example supabase/.env
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,realtime,edge-runtime,supavisor
          node scripts/write-local-env.mjs
      - name: Check the sign-in settings the app relies on
        run: |
          set -a && . apps/web/.env.local && set +a
          node scripts/check-auth-settings.mjs "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - run: pnpm --filter web build
      - name: Install the browser for end-to-end tests
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - name: Keep the end-to-end report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  # Keeps the one name to require. `checks` must pass. `e2e` must pass when it ran, and a skip is
  # not a pass smuggled in: `skipped` is accepted only because the job is deliberately not part of
  # the pull-request gate (see its comment), while `failure` and `cancelled` still fail the gate.
  gate:
    name: Standard gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, e2e]
    if: always()
    steps:
      - name: Checks passed, and the browser tests passed if they ran
        run: |
          test "${{ needs.checks.result }}" = success
          case "${{ needs.e2e.result }}" in
            success|skipped) ;;
            *) echo "End-to-end tests: ${{ needs.e2e.result }}"; exit 1 ;;
          esac
