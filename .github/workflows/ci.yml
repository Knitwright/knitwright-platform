name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions and images are pinned to an exact commit or digest, so a tag that is moved
# later cannot change what runs here. Dependabot proposes the updates.

jobs:
  secrets:
    name: Secret scan and invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Invariants I1 and I2
        run: bash scripts/check-invariants.sh
      - name: Scan history for secrets
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          git --no-banner --redact --verbose /repo

  # The checks and the end-to-end tests run side by side; together they took about
  # 25 minutes in one job, which slow runners pushed past its limit.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in what ships
        run: pnpm audit --prod --audit-level high

      # The database tests and the end-to-end tests run against local Supabase. Its
      # address and keys are the CLI's public defaults, written to apps/web/.env.local.
      - name: Start local Supabase
        run: |
          cp supabase/.env.example supabase/.env
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,realtime,edge-runtime,supavisor
          node scripts/write-local-env.mjs
      - name: Check the sign-in settings the app relies on
        run: |
          set -a && . apps/web/.env.local && set +a
          node scripts/check-auth-settings.mjs "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test:cov
      - run: pnpm --filter web build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The database tests and the end-to-end tests run against local Supabase. Its
      # address and keys are the CLI's public defaults, written to apps/web/.env.local.
      - name: Start local Supabase
        run: |
          cp supabase/.env.example supabase/.env
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,realtime,edge-runtime,supavisor
          node scripts/write-local-env.mjs
      - name: Check the sign-in settings the app relies on
        run: |
          set -a && . apps/web/.env.local && set +a
          node scripts/check-auth-settings.mjs "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - run: pnpm --filter web build
      - name: Install the browser for end-to-end tests
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - name: Keep the end-to-end report when a test fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  # Keeps the one name to require: it passes only when both jobs above passed.
  gate:
    name: Standard gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, e2e]
    if: always()
    steps:
      - name: Both checks and end-to-end tests passed
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.e2e.result }}" = success
