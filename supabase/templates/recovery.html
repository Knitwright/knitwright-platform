<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#0f1012;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:13px;letter-spacing:0.05em;text-transform:uppercase;color:#62656d;">Knitwright</p>
                <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">Reset your password</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#2a2c31;">
                  Press the button to choose a new password. The link works once and expires in one hour.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;padding:12px 20px;background:#2b46f0;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:600;">Choose a new password</a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#62656d;">
                  If you did not ask for this, ignore this message. Your password stays the same.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
